# deploy/values-controlplane-dev.yaml
# Local kind cluster overrides for lwauth-controlplane.
# Usage (from repo root):
#   helm upgrade --install lwauth-controlplane \
#     deploy/helm/lightweightauth-controlplane \
#     --namespace lwauth-system --create-namespace \
#     --values deploy/values-controlplane-dev.yaml \
#     --kube-context kind-lwauth

replicaCount: 1

image:
  repository: lwauth-controlplane
  tag: dev
  pullPolicy: Never  # image is pre-loaded via `kind load docker-image`

service:
  type: NodePort
  port: 8443
  nodePort: 30443

leaderElection:
  enabled: false  # single replica, no need for leader election

clusterName: "kind-lwauth"

# Image used by the wizard when provisioning new data-plane nodes.
defaultImage: "lwauth:dev"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
