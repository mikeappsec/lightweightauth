apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "controlplane.fullname" . }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
rules:
  # LwauthInstance and ProxyRoute CRDs.
  - apiGroups: ["lightweightauth.io"]
    resources: ["lwauthinstances", "lwauthinstances/status", "proxyroutes", "proxyroutes/status", "authconfigs", "authconfigs/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Deployments, Services, PDBs managed by the controller.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "serviceaccounts", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Events for status updates.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "controlplane.fullname" . }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "controlplane.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "controlplane.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
