{{- if .Values.gatewayRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "controlplane.fullname" . }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- toYaml .Values.gatewayRoute.parentRefs | nindent 4 }}
  {{- if .Values.gatewayRoute.hostnames }}
  hostnames:
    {{- toYaml .Values.gatewayRoute.hostnames | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "controlplane.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
