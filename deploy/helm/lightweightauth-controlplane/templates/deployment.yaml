apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "controlplane.fullname" . }}
  labels:
    {{- include "controlplane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "controlplane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "controlplane.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "controlplane.serviceAccountName" . }}
      containers:
        - name: controlplane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: api
              containerPort: 8443
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: CP_API_ADDR
              value: ":8443"
            - name: CP_METRICS_ADDR
              value: ":9090"
            - name: CP_CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: CP_DEFAULT_IMAGE
              value: {{ .Values.defaultImage | quote }}
            - name: CP_LEADER_ELECT
              value: {{ .Values.leaderElection.enabled | quote }}
            # Console authentication — enabled by default in the chart.
            # Operators must supply a bcrypt password hash.
            - name: CP_AUTH_ENABLED
              value: {{ .Values.consoleAuth.enabled | quote }}
            - name: CP_AUTH_USERNAME
              value: {{ .Values.consoleAuth.username | quote }}
            - name: CP_AUTH_COOKIE_SECURE
              value: {{ .Values.consoleAuth.cookieSecure | quote }}
            - name: CP_AUTH_SESSION_TTL
              value: {{ .Values.consoleAuth.sessionTTL | quote }}
            {{- if .Values.consoleAuth.passwordHash }}
            - name: CP_AUTH_PASSWORD_HASH
              value: {{ .Values.consoleAuth.passwordHash | quote }}
            {{- end }}
            {{- if .Values.consoleAuth.passwordHashFile }}
            - name: CP_AUTH_PASSWORD_HASH_FILE
              value: {{ .Values.consoleAuth.passwordHashFile | quote }}
            {{- end }}
            # RBAC enforcement — enabled by default in the chart.
            - name: CP_RBAC_ENABLED
              value: {{ .Values.consoleRBAC.enabled | quote }}
            {{- if .Values.alerting.enabled }}
            - name: PROMETHEUS_URL
              value: {{ .Values.alerting.prometheusURL | quote }}
            - name: LOKI_URL
              value: {{ .Values.alerting.lokiURL | quote }}
            - name: ALERT_WEBHOOK_URL
              value: {{ .Values.alerting.webhookURL | quote }}
            - name: ALERT_RULES_NAMESPACE
              value: {{ .Values.alerting.rulesNamespace | default .Release.Namespace | quote }}
            {{- end }}
            {{- if .Values.consoleOrigin }}
            - name: CP_CONSOLE_ORIGIN
              value: {{ .Values.consoleOrigin | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
