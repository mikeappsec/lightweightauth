replicaCount: 2

image:
  repository: ghcr.io/mikeappsec/lwauth-controlplane
  tag: ""  # defaults to Chart appVersion
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8443
  nodePort: ""  # only used when type is NodePort

# HTTPRoute exposes the control plane via Gateway API (e.g. Cilium's Gateway
# API implementation). Disabled by default — operators enable by setting
# `gatewayRoute.enabled: true` plus `parentRefs` and `hostnames`. TLS
# terminates at the Gateway's listener, not here, so there is no tls block.
#
# A classic networking.k8s.io/v1 Ingress template previously lived here;
# removed in 0.3.0 as part of migrating this project's own deployment from
# ingress-nginx to Gateway API. Breaking change for any other deployment
# still using it: pin to <0.3.0, or reintroduce templates/ingress.yaml from
# git history.
gatewayRoute:
  enabled: false
  parentRefs: []
    # - name: lwauth-gateway
    #   namespace: lwauth-system
    #   sectionName: https
  hostnames: []
    # - console.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

leaderElection:
  enabled: true

clusterName: "local"
defaultImage: "ghcr.io/mikeappsec/lightweightauth:latest"

# Console authentication — enabled by default in the Helm chart.
# Operators MUST set CP_AUTH_PASSWORD_HASH (or CP_AUTH_PASSWORD_HASH_FILE)
# to a bcrypt hash of the admin password. The deployment refuses to
# serve logins without it (fail-closed). Set to false only for local
# development with port-forwarding.
consoleAuth:
  enabled: true
  username: "admin"
  # passwordHash must be a bcrypt hash. Set via a Kubernetes secret and
  # reference with passwordHashFile, or inline via passwordHash.
  # Example: htpasswd -nbBC 10 "" 'mypassword' | cut -d: -f2
  passwordHash: ""
  passwordHashFile: ""
  cookieSecure: true
  sessionTTL: "12h"

# RBAC enforcement — enabled by default in the Helm chart. When true,
# API callers must present a bearer token, X-Forwarded-User header, or
# mTLS client cert. Browser console users authenticate via the session
# cookie (consoleAuth above).
consoleRBAC:
  enabled: true

# consoleOrigin restricts WebSocket upgrades to a single trusted origin.
# Set to the full scheme+host of the UI (e.g. https://lwauth.example.com).
# Empty string disables the check (dev mode — any origin accepted).
consoleOrigin: ""

# Additional clusters to watch (Phase 2).
# clusters:
#   - name: prod-us-east
#     kubeconfigSecret: us-east-kubeconfig

nodeSelector: {}
tolerations: []
affinity: {}

# Alerting (Phase 2): the control-plane engine pulls rule evaluations
# from Prometheus and/or Loki and surfaces triage answers in the UI.
# All URLs are optional — unset backends degrade silently to a
# readonly rule catalog (no firings, dashboard banner reports
# "degraded"). The rules ConfigMap ships as part of this chart with
# the 10 locked defaults; operators commit JSON overrides under the
# `rules.json` key to customize thresholds, severities, or disable a
# built-in.
alerting:
  enabled: true
  prometheusURL: ""      # e.g. http://prometheus-server.monitoring.svc.cluster.local:9090
  lokiURL: ""             # e.g. http://loki.monitoring.svc.cluster.local:3100
  webhookURL: ""          # Slack/PagerDuty-compatible JSON webhook
  rulesNamespace: ""      # defaults to the release namespace
  # rulesOverride is serialised to the lwauth-alerting-rules
  # ConfigMap as rules.json on chart install/upgrade. Defaults to an
  # empty array — operators edit the ConfigMap in-place afterwards
  # via kubectl or commit changes via GitOps to this values block.
  rulesOverride: []
