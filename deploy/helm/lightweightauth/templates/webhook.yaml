{{- if .Values.webhook.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "lwauth.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lwauth.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  ports:
    - name: https
      port: 443
      targetPort: 9443
      protocol: TCP
  selector:
    {{- include "lwauth.selectorLabels" . | nindent 4 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "lwauth.fullname" . }}-authconfig
  labels:
    {{- include "lwauth.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "lwauth.fullname" . }}-webhook
  {{- end }}
webhooks:
  - name: authconfig.lightweightauth.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy | default "Fail" }}
    timeoutSeconds: {{ .Values.webhook.timeoutSeconds | default 5 }}
    clientConfig:
      service:
        name: {{ include "lwauth.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /validate-authconfig
      {{- if not .Values.webhook.certManager.enabled }}
      caBundle: {{ .Values.webhook.caBundle | default "" | quote }}
      {{- end }}
    rules:
      - apiGroups: ["lightweightauth.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["authconfigs"]
        scope: "Namespaced"
    {{- if .Values.webhook.namespaceSelector }}
    namespaceSelector:
      {{- toYaml .Values.webhook.namespaceSelector | nindent 6 }}
    {{- end }}
{{- if .Values.webhook.certManager.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "lwauth.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lwauth.labels" . | nindent 4 }}
spec:
  secretName: {{ include "lwauth.fullname" . }}-webhook-tls
  dnsNames:
    - {{ include "lwauth.fullname" . }}-webhook.{{ .Release.Namespace }}.svc
    - {{ include "lwauth.fullname" . }}-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ .Values.webhook.certManager.issuerRef.name }}
    kind: {{ .Values.webhook.certManager.issuerRef.kind | default "ClusterIssuer" }}
{{- end }}
{{- end }}
